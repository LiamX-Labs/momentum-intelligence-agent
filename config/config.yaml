universe:
  name: SP500

# Data bar interval: "1d" for daily, "4h" for 4-hour candles.
# Switching to 4h automatically scales lookbacks, EMAs, and
# rolling windows to maintain equivalent time windows.
data:
  interval: 4h
  bar_multiplier: 6
  lookback_bars: 400
  spy_lookback_bars: 800

momentum:
  lookbacks: [1, 3, 5, 10, 20]
  candidate_count: 50
  min_score: 40
  weights:
    return_5d: 0.30
    return_10d: 0.25
    return_20d: 0.20
    relative_strength: 0.15
    volume: 0.10
  scoring:
    winsorize: true
    winsor_lower: 0.01
    winsor_upper: 0.99
    robust: true

models:
  primary:
    provider: featherless
    model: moonshotai/Kimi-K2-Instruct
  critic:
    provider: featherless
    model: Qwen/Qwen3-32B
  fallback:
    provider: featherless
    model: deepseek-ai/DeepSeek-V3.2

ai:
  min_confidence: 0.50
  require_critic: true
  model: moonshotai/Kimi-K2-Instruct

options:
  min_dte: 7
  max_dte: 21
  target_delta_min: 0.30
  target_delta_max: 0.85
  max_bid_ask_spread_pct: 0.50
  # Liquidity guards (see options/selector.py) -- never buy a contract
  # with a near-zero bid, thin open interest, or a strike far from the
  # underlying, regardless of how cheap the premium looks.
  min_bid_price: 0.05
  min_open_interest: 0
  strike_proximity_max_pct: 0.25

risk:
  max_risk_per_trade: 0.01
  max_open_positions: 5
  max_portfolio_option_premium: 0.20
  max_symbol_exposure: 0.05
  max_holding_days: 10

regime:
  bull_max_exposure: 1.0
  neutral_max_exposure: 0.6
  bear_max_exposure: 0.25

decision:
  min_momentum_score: 40
  min_ai_confidence: 0.50
  require_critic_approval: true

final_scoring:
  momentum_weight: 0.30
  relative_strength_weight: 0.20
  fundamental_quality_weight: 0.15
  catalyst_weight: 0.15
  k2_confidence_weight: 0.10
  qwen_adjusted_confidence_weight: 0.10

hard_reject:
  qwen_recommendation_reject: true
  qwen_confidence_below: 0.25
  momentum_below: 40
  option_spread_above_pct: 0.10
  risk_score_above: 0.85
  earnings_in_holding_period: true

demo:
  enabled: true
  qwen_advisory_only: false
  override_risk_gates: false

scheduler:
  interval_minutes: 15
  enabled_on_start: true

alpaca:
  paper: true
  base_url_paper: https://paper-api.alpaca.markets
  base_url_live: https://api.alpaca.markets
  data_url: https://data.alpaca.markets

execution:
  # Broker (Alpaca paper) rejects option orders with qty > 1000.
  # Chunk any order above this size into multiple sub-orders so a
  # single large fill can never trip that limit.
  max_order_chunk_size: 500